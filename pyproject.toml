[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizurrr"
version = "1.0.0"
description = "Terminal ANSI visualizer: 68 generative patterns and 26 palettes, pure Python standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.scripts]
visualizurrr = "visualizurrr:main"

[tool.setuptools]
py-modules = ["visualizurrr"]
